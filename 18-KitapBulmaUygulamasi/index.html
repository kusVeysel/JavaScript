<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitap Bulma Uygulaması</title>
    <link href="../../WebTasarim/CDN/BootstrapCDN.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            margin-top: 100px;
        }
    </style>
</head>

<body>
    <div class="col-9">
        <div class="d-flex align-items-center flex-column">

            <table class="table table-striped table-bordered table-hover text-center align-middle px-2 ">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">Kitap Adı</th>
                        <th scope="col">Yazar</th>
                        <th scope="col">Fiyat</th>
                    </tr>
                </thead>
                <tbody id="bookTableBody">

                </tbody>
            </table>

            <div style="text-align: center; width: 300px;">
                <input type="search" name="ara" id="ara" placeholder="Kitap ara..."
                    class="form-control col-3 mx-auto mt-3" style="width: 100%;">
                <button class="btn btn-primary mt-3"
                    onclick="kitapbul(document.getElementById('ara').value)">Ara</button>
            </div>

        </div>
    </div>


    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
