<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Genel Özet</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Georgia, "Times New Roman", serif;
            background: #f4f1ea;
            color: #25231f;
        }

        body {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px 56px;
        }

        header {
            border-bottom: 3px solid #c85c3f;
            margin-bottom: 24px;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.8rem);
            line-height: 1;
            margin: 0 0 12px;
        }

        header p {
            max-width: 720px;
            font-size: 1.1rem;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            border: 2px solid #25231f;
            border-radius: 4px;
            background: #fffdf8;
            padding: 13px 15px;
            margin-bottom: 24px;
            font: inherit;
            font-size: 1rem;
        }

        main {
            display: grid;
            gap: 16px;
        }

        article {
            border-left: 6px solid #e0a458;
            background: #fffdf8;
            padding: 18px 20px;
            box-shadow: 5px 5px 0 #d9d1c4;
        }

        article h2 {
            color: #9b3e2b;
            font-size: 1.25rem;
            margin: 0 0 12px;
            overflow-wrap: anywhere;
        }

        article section {
            border-top: 1px solid #e2dbd0;
            padding: 12px 0 2px;
        }

        article h3 {
            color: #5b574f;
            font-family: Arial, sans-serif;
            font-size: 0.82rem;
            letter-spacing: 0.04em;
            margin: 0 0 6px;
            text-transform: uppercase;
        }

        article ul {
            margin: 0;
            padding-left: 22px;
        }

        article li {
            line-height: 1.55;
            margin: 5px 0;
        }
    </style>
</head>

<body>

    <script src="GenelOzet.js"></script>
</body>

</html>
